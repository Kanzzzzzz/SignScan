[project]
name = "signscan-ml"
version = "0.1.0"
description = "SignScan: landmark dataset, 1D-CNN training, evaluation and ONNX export"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.14",
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "opencv-python>=4.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

# uv: install the CPU-only PyTorch build (the model is tiny; no CUDA download needed)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["signscan_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
